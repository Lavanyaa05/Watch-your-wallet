plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
localProperties.load(new FileInputStream(rootProject.file("local.properties")))

android {
    namespace 'com.group27.watchyourwallet'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/native-image/org.mongodb/bson/native-image.properties']
        }
    }

    defaultConfig {
        applicationId "com.group27.watchyourwallet"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
        buildConfigField "String", "MONGODB_URI", "\"${properties.getProperty('MONGODB_URI')}\""
        buildConfigField "String", "VISION_API_KEY", "\"${properties.getProperty('VISION_API_KEY')}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "VISION_API_KEY", "\"${localProperties['VISION_API_KEY']}\""
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "VISION_API_KEY", "\"${localProperties['VISION_API_KEY']}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    // ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Retrofit (for calling your backend API)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // CameraX (for receipt scanner)
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Testing (keep these)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.espresso:espresso-core:3.5.1'

    // MongoDB Driver
    implementation 'org.mongodb:mongodb-driver-sync:4.11.0'
}